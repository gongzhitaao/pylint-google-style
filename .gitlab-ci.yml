workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - lint
  - test
  - publish

default:
  image: python:3.13-slim
  interruptible: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"

lint:
  stage: lint
  script:
    - uv sync
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  script:
    - uv sync
    - uv run pytest --cov=src/pylint_google_style --cov-report=term-missing --cov-report=xml:coverage.xml
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    expire_in: 1 day
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

publish:
  stage: publish
  interruptible: false
  script:
    - uv build
    - uv publish
        --publish-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
        --token $CI_JOB_TOKEN
  rules:
    - if: $CI_COMMIT_TAG
