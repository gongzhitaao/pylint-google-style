stages:
  - lint
  - test
  - publish

default:
  image: python:3.13-slim
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"

lint:
  stage: lint
  script:
    - uv sync
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  script:
    - uv sync
    - uv run pytest

publish:
  stage: publish
  script:
    - uv build
    - uv publish
        --publish-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
        --token $CI_JOB_TOKEN
  rules:
    - if: $CI_COMMIT_TAG
