stages:
  - lint
  - test
  - publish

lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:latest
  script:
    - uv sync
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  image: ghcr.io/astral-sh/uv:latest
  script:
    - uv sync
    - uv run pytest

publish:
  stage: publish
  image: ghcr.io/astral-sh/uv:latest
  script:
    - uv build
    - uv publish
        --publish-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
        --token $CI_JOB_TOKEN
  rules:
    - if: $CI_COMMIT_TAG
