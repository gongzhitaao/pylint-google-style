variables:
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:latest
  MR_IMAGE: $CI_REGISTRY_IMAGE/ci:mr-$CI_MERGE_REQUEST_ID
  PENDING_IMAGE: $CI_REGISTRY_IMAGE/ci:main-$CI_COMMIT_SHORT_SHA

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - build-image
  - lint
  - test
  - publish

default:
  interruptible: true

.docker-trigger-files: &docker-trigger-files
  - .gitlab/ci/Dockerfile

# Build MR-specific image when Dockerfile changes in MR
build-ci-image-mr:
  stage: build-image
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docker-trigger-files
      when: always
    - when: never
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f .gitlab/ci/Dockerfile -t $MR_IMAGE .
    - docker push $MR_IMAGE

# Post-merge: build SHA-tagged image (promoted to :latest after tests)
build-ci-image-main:
  stage: build-image
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docker-trigger-files
      when: always
    - when: never
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f .gitlab/ci/Dockerfile -t $PENDING_IMAGE .
    - docker push $PENDING_IMAGE

lint:
  stage: lint
  image: $TEST_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docker-trigger-files
      variables:
        TEST_IMAGE: $PENDING_IMAGE
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        TEST_IMAGE: $CI_IMAGE
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docker-trigger-files
      variables:
        TEST_IMAGE: $MR_IMAGE
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        TEST_IMAGE: $CI_IMAGE
  script:
    - uv sync
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  image: $TEST_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docker-trigger-files
      variables:
        TEST_IMAGE: $PENDING_IMAGE
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        TEST_IMAGE: $CI_IMAGE
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docker-trigger-files
      variables:
        TEST_IMAGE: $MR_IMAGE
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        TEST_IMAGE: $CI_IMAGE
  script:
    - uv sync
    - uv run pytest --cov=src/pylint_google_style --cov-report=term-missing --cov-report=xml:coverage.xml
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    expire_in: 1 day
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Promote pending image to :latest after tests pass
publish-ci-image:
  stage: publish
  image: docker:latest
  services:
    - docker:dind
  resource_group: docker-latest
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docker-trigger-files
      when: on_success
    - when: never
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $PENDING_IMAGE
    - docker tag $PENDING_IMAGE $CI_IMAGE
    - docker push $CI_IMAGE

publish-pypi:
  stage: publish
  # When the Dockerfile changed in this pipeline, publish-ci-image only
  # promotes the new image to :latest in this same stage (in parallel),
  # so $CI_IMAGE may still be stale here.  Use the SHA-tagged pending
  # image built in the build-image stage instead.
  image: $JOB_IMAGE
  interruptible: false
  variables:
    PUBLISH_TARGETS: "gitlab,gcp"
    GCP_LOCATION: us-central1
    GCP_REPO: makermaker-pypi
    # GCP_PROJECT_ID is an inherited group variable.
    # PYLINT_GOOGLE_STYLE_CI_DEPLOYER_B64_JSON is a base64-encoded JSON key
    # for the publisher service account (project/masked CI/CD variable).
  script:
    - bash .gitlab/ci/publish_pypi.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docker-trigger-files
      variables:
        JOB_IMAGE: $PENDING_IMAGE
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        JOB_IMAGE: $CI_IMAGE
